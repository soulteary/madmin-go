version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
  settings:
    misspell:
      locale: US
    staticcheck:
      # Replicates the behaviour of the previously enabled "gosimple" linter,
      # which was merged into staticcheck in golangci-lint v2. Only the
      # simplification (S1xxx) checks are run to keep parity with the old setup.
      checks:
        - S1*
  exclusions:
    generated: lax
    rules:
      - linters:
          - revive
        text: should have comment
      - linters:
          - revive
        text: should have a package comment
      - linters:
          - revive
          - staticcheck
        text: error strings should not be capitalized or end with punctuation or a newline
      - linters:
          - revive
        text: don't use ALL_CAPS in Go names

formatters:
  enable:
    - gofumpt
    - goimports
